<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pluriversal Land Use — Team Dashboard</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3F5A3B">
<meta name="description" content="Team dashboard for the Pluriversal Land Use project — working groups, key ideas, research feed, and team coordination.">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/icon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Pluriverse">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EEF0E3;
    --paper-deep:#E3E6D4;
    --ink:#1E2A20;
    --ink-soft:#48564A;
    --ink-faint:#7C8874;
    --line:#C6CBB4;
    --moss:#5B7553;
    --moss-deep:#3F5A3B;
    --ochre:#B4872E;
    --clay:#A8583A;
    --indigo:#3A5871;
    --plum:#6E4A63;
    --sage:#7C9670;
    --gold:#C9A227;
    --card:#F6F6EC;
    --shadow: 0 1px 0 rgba(30,42,32,0.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans','Noto Sans JP', sans-serif;
    -webkit-font-smoothing:antialiased;
    background-image:
      radial-gradient(circle at 1px 1px, rgba(30,42,32,0.06) 1px, transparent 0);
    background-size: 22px 22px;
  }
  .mono{font-family:'IBM Plex Mono', monospace;}
  a{color:var(--indigo);}
  a:hover{color:var(--clay);}
  button{font-family:inherit; cursor:pointer;}
  input,textarea,select{font-family:inherit; font-size:14px;}
  ::selection{background:var(--gold); color:var(--ink);}

  /* ---------- shell ---------- */
  .shell{max-width:1180px;margin:0 auto;padding:0 28px 80px;}
  header.topbar{
    position:sticky; top:0; z-index:30;
    background:linear-gradient(var(--paper) 82%, transparent);
    padding:20px 0 10px;
  }
  .brand-row{display:flex; align-items:baseline; justify-content:space-between; gap:20px; flex-wrap:wrap;}
  .brand{display:flex; align-items:baseline; gap:14px;}
  .brand .mark{
    font-family:'Fraunces', serif; font-weight:700; font-size:15px;
    letter-spacing:0.14em; text-transform:uppercase;
    color:var(--moss-deep); border:1px solid var(--moss-deep);
    padding:3px 8px; border-radius:3px;
  }
  .brand h1{
    font-family:'Fraunces', serif; font-weight:600; font-size:26px; margin:0;
    letter-spacing:-0.01em;
  }
  .brand h1 i{font-style:italic; font-weight:500; color:var(--moss-deep);}
  .lang-toggle{display:flex; border:1px solid var(--line); border-radius:20px; overflow:hidden; flex:none;}
  .lang-toggle button{
    background:#fff; border:none; padding:6px 13px; font-size:12px; font-family:'IBM Plex Mono',monospace;
    letter-spacing:.04em; color:var(--ink-soft);
  }
  .lang-toggle button.active{background:var(--moss-deep); color:#fff;}
  nav.tabs{display:flex; gap:4px; margin-top:16px; border-bottom:1px solid var(--line); flex-wrap:wrap;}
  nav.tabs button{
    background:none; border:none; padding:10px 14px; font-size:13.5px;
    color:var(--ink-soft); border-bottom:2px solid transparent; margin-bottom:-1px;
    letter-spacing:0.01em;
  }
  nav.tabs button:hover{color:var(--ink);}
  nav.tabs button.active{color:var(--ink); border-bottom-color:var(--moss-deep); font-weight:500;}

  main{padding-top:26px;}
  .eyebrow{
    font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:0.12em;
    text-transform:uppercase; color:var(--ink-faint); margin:0 0 6px;
  }
  h2.section-title{font-family:'Fraunces', serif; font-size:22px; font-weight:600; margin:0 0 4px;}
  p.lede{color:var(--ink-soft); max-width:640px; line-height:1.6; font-size:14.5px;}

  /* ---------- overview / diagram ---------- */
  .overview-grid{display:grid; grid-template-columns:1.15fr 0.85fr; gap:36px; align-items:start;}
  @media (max-width:880px){.overview-grid{grid-template-columns:1fr;}}
  .diagram-wrap{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:8px; box-shadow:var(--shadow);}
  .pub-figure{margin:16px 0 22px; max-width:680px;}
  .pub-figure img{width:100%; height:auto; border-radius:10px; border:1px solid var(--line); display:block;}
  .pub-figure figcaption{font-size:12px; color:var(--ink-faint); margin-top:8px; font-style:italic; line-height:1.5;}
  .petal{cursor:pointer;}
  .petal circle.ring{fill:none; stroke-width:1; transition:stroke-width 0.15s, r 0.15s;}
  .petal:hover circle.ring{stroke-width:2.5;}
  .petal:hover circle.core{filter:brightness(1.06);}
  .petal text{pointer-events:none; font-family:'IBM Plex Sans','Noto Sans JP', sans-serif;}
  .petal-label{font-size:12.5px; font-weight:600; fill:var(--ink);}
  .petal-sub{font-size:9.5px; fill:var(--ink-soft); font-family:'IBM Plex Mono', monospace; letter-spacing:0.03em;}
  .center-label{font-family:'Fraunces', serif; font-size:15px; font-weight:600; fill:var(--ink); text-anchor:middle;}
  .flow-arrow{fill:none; stroke:var(--ink-faint); stroke-width:1.4; stroke-dasharray:1 5; stroke-linecap:round;}

  .wg-list{display:flex; flex-direction:column; gap:10px;}
  .wg-list-item{
    display:flex; align-items:center; gap:12px; background:var(--card);
    border:1px solid var(--line); border-radius:8px; padding:12px 14px; cursor:pointer;
    transition:transform .12s, box-shadow .12s;
  }
  .wg-list-item:hover{transform:translateX(3px); box-shadow:var(--shadow);}
  .wg-dot{width:11px; height:11px; border-radius:50%; flex:none;}
  .wg-list-item .name{font-weight:600; font-size:14px;}
  .wg-list-item .lead{color:var(--ink-faint); font-size:12px; font-family:'IBM Plex Mono', monospace;}
  .wg-list-item .arrow{margin-left:auto; color:var(--ink-faint); font-size:16px;}

  /* ---------- cards / chips ---------- */
  .chip{
    display:inline-flex; align-items:center; gap:5px; font-size:11.5px;
    padding:3px 9px; border-radius:20px; border:1px solid var(--line);
    background:#fff; color:var(--ink-soft); font-family:'IBM Plex Mono', monospace;
  }
  .chip .sw{width:7px; height:7px; border-radius:50%;}
  .chip .chip-x{background:none; border:none; color:var(--ink-faint); cursor:pointer; font-size:12px; padding:0 0 0 3px; line-height:1;}
  .chip .chip-x:hover{color:var(--clay);}
  .kw-block{margin:10px 0 16px;}
  .kw-chips{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px;}
  .back-link{
    display:inline-flex; align-items:center; gap:6px; background:none; border:none;
    color:var(--ink-soft); font-size:13px; padding:0; margin-bottom:18px;
  }
  .back-link:hover{color:var(--ink);}

  .wg-header{display:flex; gap:20px; align-items:flex-start; flex-wrap:wrap; margin-bottom:22px;}
  .wg-badge{width:56px; height:56px; border-radius:50%; flex:none; display:flex; align-items:center; justify-content:center; color:#fff; font-family:'Fraunces',serif; font-weight:600; font-size:20px;}
  .wg-title-block h2{margin:0 0 4px;}
  .wg-title-block .role{font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--ink-faint);}
  textarea.edit-desc{width:100%; max-width:640px; min-height:60px; border:1px solid var(--line); border-radius:6px; padding:8px 10px; background:#fff; color:var(--ink); line-height:1.5;}

  .author-card{
    background:var(--card); border:1px solid var(--line); border-radius:10px;
    padding:16px 18px; margin-bottom:16px;
  }
  .author-card .top{display:flex; align-items:flex-start; justify-content:space-between; gap:12px; flex-wrap:wrap;}
  .author-card .name{font-family:'Fraunces', serif; font-weight:600; font-size:17px;}
  .author-card .affil{color:var(--ink-faint); font-size:12.5px; margin-top:2px;}
  .link-row{display:flex; gap:14px; margin-top:6px; flex-wrap:wrap; font-size:12.5px;}
  .refresh-btn{
    background:#fff; border:1px solid var(--line); border-radius:6px; padding:5px 10px;
    font-size:12px; color:var(--ink-soft); display:flex; align-items:center; gap:6px;
  }
  .refresh-btn:hover{border-color:var(--moss);}
  .refresh-btn.loading{opacity:0.6;}
  .pub-list{margin-top:12px; border-top:1px solid var(--line); padding-top:10px;}
  .pub{padding:8px 0; border-bottom:1px dashed var(--line); font-size:13.5px; line-height:1.45;}
  .pub:last-child{border-bottom:none;}
  .pub .ptitle{font-weight:500;}
  .pub .pmeta{color:var(--ink-faint); font-size:12px; margin-top:2px; font-family:'IBM Plex Mono', monospace;}
  .pub-empty{color:var(--ink-faint); font-size:12.5px; font-style:italic; padding:6px 0;}
  .fetch-note{font-size:11.5px; color:var(--ink-faint); margin-top:6px;}
  .fetch-note a{color:inherit; text-decoration:underline;}

  .btn{
    background:var(--moss-deep); color:#fff; border:none; border-radius:6px;
    padding:9px 16px; font-size:13px; font-weight:500; display:inline-flex; align-items:center; gap:6px;
  }
  .btn:hover{background:var(--ink);}
  .btn.ghost{background:#fff; color:var(--ink-soft); border:1px solid var(--line);}
  .btn.ghost:hover{border-color:var(--moss); color:var(--ink);}
  .btn.small{padding:6px 10px; font-size:12px;}

  .theme-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(230px,1fr)); gap:14px; margin-top:18px;}
  .theme-card{
    background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px;
    cursor:pointer; border-top:4px solid var(--moss);
  }
  .theme-card:hover{box-shadow:var(--shadow); transform:translateY(-2px); transition:.12s;}
  .theme-card h3{font-family:'Fraunces', serif; font-size:16px; margin:0 0 6px;}
  .theme-card p{font-size:12.5px; color:var(--ink-soft); margin:0 0 10px; line-height:1.4;}
  .theme-card .count{font-size:11px; color:var(--ink-faint); font-family:'IBM Plex Mono', monospace;}

  table.authors-table{width:100%; border-collapse:collapse; margin-top:16px; font-size:13.5px;}
  table.authors-table th{text-align:left; font-family:'IBM Plex Mono',monospace; font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-faint); padding:8px 10px; border-bottom:1px solid var(--line);}
  table.authors-table td{padding:10px; border-bottom:1px solid var(--line); vertical-align:top;}
  table.authors-table tr.author-row{cursor:pointer;}
  table.authors-table tr.author-row:hover td{background:rgba(91,117,83,0.06);}
  table.authors-table .row-toggle{color:var(--ink-faint); font-family:'IBM Plex Mono',monospace; margin-right:2px;}
  table.authors-table tr.author-detail-row td{padding:0 0 16px; border-bottom:1px solid var(--line); background:var(--paper-deep);}
  table.authors-table tr.author-detail-row .author-card{margin:10px 12px 0; border-radius:8px;}
  .tag-mini{display:inline-block; font-size:10.5px; padding:2px 7px; border-radius:20px; background:#fff; border:1px solid var(--line); margin:1px 3px 1px 0; color:var(--ink-soft);}

  .form-panel{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:20px; margin-top:16px;}
  .form-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  @media (max-width:640px){.form-grid{grid-template-columns:1fr;}}
  .field label{display:block; font-size:11.5px; font-family:'IBM Plex Mono',monospace; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-faint); margin-bottom:5px;}
  .field input, .field select, .field textarea{width:100%; border:1px solid var(--line); border-radius:6px; padding:8px 10px; background:#fff;}
  .field.full{grid-column:1/-1;}
  .checks{display:flex; flex-wrap:wrap; gap:8px;}
  .check-pill{display:flex; align-items:center; gap:6px; border:1px solid var(--line); border-radius:20px; padding:5px 11px; font-size:12px; background:#fff; cursor:pointer;}
  .check-pill input{margin:0;}
  .form-actions{display:flex; gap:10px; margin-top:16px; flex-wrap:wrap;}

  .settings-block{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:20px; max-width:560px;}
  .settings-block h3{font-family:'Fraunces',serif; font-size:16px; margin:0 0 6px;}
  .settings-block p{font-size:13px; color:var(--ink-soft); line-height:1.5;}

  /* ---------- key ideas ---------- */
  .idea-category{margin-top:30px;}
  .idea-category:first-child{margin-top:6px;}
  .idea-category h3{
    font-family:'IBM Plex Mono', monospace; font-size:12px; letter-spacing:0.14em;
    text-transform:uppercase; color:var(--ink-faint); border-bottom:1px solid var(--line);
    padding-bottom:6px; margin:0 0 14px;
  }
  .idea-card{background:var(--card); border:1px solid var(--line); border-radius:10px; margin-bottom:12px; overflow:hidden;}
  .idea-head{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 18px; cursor:pointer;}
  .idea-head h4{font-family:'Fraunces', serif; font-weight:600; font-size:16px; margin:0;}
  .idea-toggle{color:var(--ink-faint); font-size:13px; flex:none;}
  .idea-body{padding:0 18px 18px;}
  .worldview-grid{display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:6px;}
  @media (max-width:700px){.worldview-grid{grid-template-columns:1fr;}}
  .worldview-col{border-radius:8px; padding:13px 15px; font-size:13px; line-height:1.6;}
  .worldview-col.one-world{background:#F1ECE4; border-left:3px solid var(--clay);}
  .worldview-col.pluriverse{background:#EAF0E4; border-left:3px solid var(--moss);}
  .worldview-col .wv-label{font-family:'IBM Plex Mono',monospace; font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-faint); margin-bottom:6px; display:block;}
  .lit-section{margin-top:16px; border-top:1px dashed var(--line); padding-top:12px;}
  .lit-header{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;}
  .lit-item{padding:7px 0; border-bottom:1px dashed var(--line); font-size:13px;}
  .lit-item:last-child{border-bottom:none;}
  .lit-item .lmeta{font-size:11.5px; color:var(--ink-faint); font-family:'IBM Plex Mono',monospace; margin-top:2px;}
  .add-source-row{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;}
  .add-source-row input{flex:1; min-width:160px; border:1px solid var(--line); border-radius:6px; padding:7px 9px; background:#fff; font-size:12.5px;}

  /* ---------- team coordination ---------- */
  .team-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(260px,1fr)); gap:14px; margin-top:18px;}
  .team-card{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px;}
  .team-card .top{display:flex; gap:12px; align-items:center;}
  .avatar{width:40px; height:40px; border-radius:50%; flex:none; display:flex; align-items:center; justify-content:center; color:#fff; font-family:'Fraunces',serif; font-weight:600; font-size:14px;}
  .team-card .name{font-weight:600; font-size:14.5px;}
  .team-card .role-line{font-size:11.5px; color:var(--ink-faint); margin-top:1px;}
  .team-card .chips{margin-top:10px;}
  .status-box{width:100%; margin-top:10px; border:1px solid var(--line); border-radius:6px; padding:8px 9px; font-size:12.5px; background:#fff; min-height:44px; resize:vertical;}
  .status-box::placeholder{color:var(--ink-faint);}

  /* ---------- research feed ---------- */
  .feed-form{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:18px; margin:16px 0 26px;}
  .feed-item{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px 18px; margin-bottom:12px;}
  .feed-item .ftitle{font-family:'Fraunces', serif; font-weight:600; font-size:15.5px;}
  .feed-item .fnote{font-size:13.5px; color:var(--ink-soft); margin-top:6px; line-height:1.55;}
  .feed-item .fmeta{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:10px; flex-wrap:wrap;}
  .feed-item .fby{font-size:11.5px; color:var(--ink-faint); font-family:'IBM Plex Mono',monospace;}
  .feed-tags{display:flex; gap:5px; flex-wrap:wrap;}

  .empty-state{text-align:center; padding:50px 20px; color:var(--ink-faint);}
  .icon-btn{background:none; border:none; color:var(--ink-faint); font-size:13px; padding:4px;}
  .icon-btn:disabled{opacity:0.25; cursor:default;}
  .reorder-btns{display:flex; flex-direction:column; gap:0; flex:none;}
  .reorder-btns button{font-size:10px; line-height:1; padding:2px 4px;}
  .icon-btn:hover{color:var(--clay);}
  .loader-dot{display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--gold); animation:pulse 1s infinite ease-in-out;}
  @keyframes pulse{0%,100%{opacity:0.3;}50%{opacity:1;}}
  .toast{
    position:fixed; bottom:20px; right:20px; background:var(--ink); color:var(--paper);
    padding:10px 16px; border-radius:6px; font-size:13px; z-index:100; opacity:0;
    transform:translateY(6px); transition:.2s; pointer-events:none;
  }
  .toast.show{opacity:1; transform:translateY(0);}
</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="brand-row">
      <div class="brand">
        <span class="mark">PLU/2026</span>
        <h1 id="brand-title">Pluriversal <i>Land Use</i></h1>
      </div>
      <div class="lang-toggle" id="lang-toggle">
        <button data-lang="en">EN</button>
        <button data-lang="ja">日本語</button>
      </div>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </header>
  <main id="app"></main>
</div>
<div class="toast" id="toast"></div>

<!--
  Firebase (compat SDK — works from a plain classic script tag, no bundler needed).
  Only used when this file is deployed on its own (outside Claude), where
  window.storage isn't available. Harmless to load even if unused/blocked.
-->
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-storage-compat.js"></script>

<script>
/* ============================= i18n ============================= */

const STRINGS = {
  en:{

    pub_tab_home:'Home', pub_tab_team:'Team', pub_tab_blog:'Blog', pub_tab_contact:'Contact', pub_tab_login:'Team Login',

    pub_blog_eyebrow:'From the project', pub_blog_heading:'Blog', pub_blog_lede:'Updates and reflections from the team.',
    pub_blog_empty:'No posts yet \u2014 check back soon.', pub_blog_back:'\u2190 Back to blog',
    blog_admin_eyebrow:'Public blog', blog_admin_heading:'Blog', blog_admin_lede:'Write here, then publish when it\u2019s ready \u2014 published posts show on the public site immediately; drafts stay internal.',

    blog_title_ph:'Post title', blog_body_ph:'Write the post…', blog_save_draft:'Save draft', blog_delete:'Delete post',

    diagram_team_in_dev:'team in development',
    ov_note:(n)=>`${n} people tracked · publications auto-pull from researchmap on open (cached ~6h, shared across the team).`,

function t(key, ...args){
  const dict = STRINGS[STATE.lang] || STRINGS.en;
  const val = dict[key] !== undefined ? dict[key] : STRINGS.en[key];
  return typeof val === 'function' ? val(...args) : val;
}
function L(obj, field){
  if(!obj) return '';
  if(STATE.lang === 'ja'){
    const jaVal = obj[field+'Ja'];
    if(jaVal) return jaVal;
  }

let usingClaudeStorage = false;

let fsDb = null;

let fsStorage = null; // Firebase Storage, for actual file uploads (e.g. blog PDFs) — separate from Firestore

function firebaseConfigured(){
  return FIREBASE_CONFIG.apiKey && !FIREBASE_CONFIG.apiKey.startsWith('PASTE_');
}

async function initStorageBackend(){
  if (typeof window.storage !== 'undefined' && window.storage) {
    usingClaudeStorage = true;
    return;
  }
  if (!firebaseConfigured()) {
    console.warn('No Firebase config set and window.storage is unavailable — running with in-memory defaults only, nothing will be saved. See index.html FIREBASE_CONFIG.');
    return;
  }
  try {
    firebase.initializeApp(FIREBASE_CONFIG);
    const cred = await firebase.auth().signInAnonymously();
    fsUid = cred.user.uid;
    fsDb = firebase.firestore();
    try{ fsStorage = firebase.storage(); }catch(e){ console.warn('Firebase Storage unavailable (PDF uploads won\u2019t work until it\u2019s enabled in the Firebase console):', e); }
    firebaseReady = true;
  } catch (e) {
    console.error('Firebase init failed — running with in-memory defaults only.', e);
  }
}

function firestoreDocId(key, shared){
  return shared ? `shared__${key}` : `private__${fsUid}__${key}`;
}

async function storeGet(key, fallback, shared){
  const sc = shared === undefined ? SHARED : shared;
  if (usingClaudeStorage) {
    try{
      const r = await window.storage.get(key, sc);
      return r ? JSON.parse(r.value) : fallback;
    }catch(e){ return fallback; }
  }
  if (firebaseReady && fsDb) {
    try{
      const snap = await fsDb.collection(FIRESTORE_COLLECTION).doc(firestoreDocId(key, sc)).get();
      return snap.exists ? JSON.parse(snap.data().json) : fallback;
    }catch(e){ console.error('Firestore get failed', key, e); return fallback; }
  }
  return fallback;
}
async function storeSet(key, value, shared){
  const sc = shared === undefined ? SHARED : shared;
  if (usingClaudeStorage) {
    try{ await window.storage.set(key, JSON.stringify(value), sc); }
    catch(e){ console.error('storage set failed', key, e); }
    return;
  }
  if (firebaseReady && fsDb) {
    try{
      await fsDb.collection(FIRESTORE_COLLECTION).doc(firestoreDocId(key, sc)).set({
        json: JSON.stringify(value),
        updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
      });
    }catch(e){ console.error('Firestore set failed', key, e); }
  }
}
async function storeDelete(key, shared){
  const sc = shared === undefined ? SHARED : shared;
  if (usingClaudeStorage) {
    try{ await window.storage.delete(key, sc); }catch(e){}
    return;
  }
  if (firebaseReady && fsDb) {
    try{ await fsDb.collection(FIRESTORE_COLLECTION).doc(firestoreDocId(key, sc)).delete(); }catch(e){}
  }
}

// Backfills any fields present in the current code's defaults but missing from a
// previously-saved record (e.g. new WG fields added after a team started using the
// site). Anything the team has actually edited/saved is left untouched; only truly
// absent keys get filled in from the current default.
function mergeWithDefaults(stored, defaults){
  const defaultsById = {};
  defaults.forEach(d=>{ defaultsById[d.id] = d; });
  const merged = (stored||[]).map(item=>{
    const def = defaultsById[item.id];
    return def ? Object.assign({}, def, item) : item;
  });
  const seenIds = new Set((stored||[]).map(s=>s.id));
  defaults.forEach(d=>{ if(!seenIds.has(d.id)) merged.push(d); });
  return merged;
}

/* ============================= PUBLICATION FETCH ============================= */

function localized(v){
  if(!v) return '';
  if(typeof v === 'string') return v;
  if(typeof v === 'object') return v.en || v.ja || Object.values(v)[0] || '';
  return '';
}

function normalizeResearchmapItem(item){
  try{
    const title = localized(item.paper_title || item.title || item['dc:title']);
    if(!title) return null;
    const journal = localized(item.journal || item.publication_name || item.publisher_name);
    const date = item.publication_date || item.date || '';
    let link = '';
    if(item.identifiers && item.identifiers.doi && item.identifiers.doi[0]){
      link = 'https://doi.org/' + item.identifiers.doi[0];
    } else if(item['@id']){
      link = item['@id'];
    }
    return { title, journal, date, link, source:'researchmap' };
  }catch(e){ return null; }
}

async function fetchResearchmapPubs(slug){
  const url = `https://api.researchmap.jp/${encodeURIComponent(slug)}/published_papers?limit=25&format=json`;
  const res = await fetch(url);
  if(!res.ok) throw new Error('HTTP ' + res.status);
  const data = await res.json();
  const items = (data && data.items) ? data.items : [];
  return items.map(normalizeResearchmapItem).filter(Boolean);
}

async function loadPubsForAuthor(author, force){
  if(!author.researchmapSlug){
    STATE.pubCache[author.id] = { loading:false, error:null, items:[], fetchedAt:Date.now(), noSource:true };
    return;
  }
  const cacheKey = 'pluriverse:cache:' + author.id;
  if(!force){
    const cached = await storeGet(cacheKey, null);
    if(cached && (Date.now() - cached.fetchedAt) < 1000*60*60*6){
      STATE.pubCache[author.id] = { loading:false, error:null, items:cached.items, fetchedAt:cached.fetchedAt };
      render();
      return;
    }
  }
  STATE.pubCache[author.id] = { loading:true, error:null, items:(STATE.pubCache[author.id]||{}).items||[], fetchedAt:null };
  render();
  try{
    const items = await fetchResearchmapPubs(author.researchmapSlug);
    const payload = { loading:false, error:null, items, fetchedAt:Date.now() };
    STATE.pubCache[author.id] = payload;
    await storeSet(cacheKey, { items, fetchedAt:payload.fetchedAt });
  }catch(e){
    STATE.pubCache[author.id] = { loading:false, error:(e && e.message) || 'fetch blocked', items:(STATE.pubCache[author.id]||{}).items||[], fetchedAt:Date.now() };
  }
  render();
}

function ensurePubsLoaded(author){
  if(!STATE.pubCache[author.id]){
    loadPubsForAuthor(author, false);
  }
}

/* ---- literature search for Key Ideas (Semantic Scholar — closest open, keyless, CORS-friendly
   equivalent to a Google Scholar API, which does not offer one publicly) ---- */

function normalizeS2Item(p){
  try{
    if(!p || !p.title) return null;
    const authors = (p.authors||[]).slice(0,3).map(a=>a.name).join(', ') + ((p.authors||[]).length>3 ? ' et al.' : '');
    return {
      title: p.title,
      journal: [p.venue, p.year].filter(Boolean).join(' · '),
      date: p.year ? String(p.year) : '',
      link: p.url || (p.externalIds && p.externalIds.DOI ? 'https://doi.org/'+p.externalIds.DOI : ''),
      authors,
      source:'semanticscholar'
    };
  }catch(e){ return null; }
}

async function fetchSemanticScholar(query){
  const url = `https://api.semanticscholar.org/graph/v1/paper/search?query=${encodeURIComponent(query)}&limit=6&fields=title,year,venue,url,authors,externalIds&sort=year:desc`;
  const res = await fetch(url);
  if(!res.ok) throw new Error('HTTP ' + res.status);
  const data = await res.json();
  const items = (data && data.data) ? data.data : [];
  return items.map(normalizeS2Item).filter(Boolean);
}

/* ---- OpenAlex: large open scholarly index, keyless, CORS-friendly ---- */

function normalizeOpenAlexItem(w){
  try{
    if(!w || !w.title) return null;
    const authorsList = (w.authorships||[]).slice(0,3).map(a=>a.author && a.author.display_name).filter(Boolean).join(', ')
      + ((w.authorships||[]).length > 3 ? ' et al.' : '');
    const venue = (w.primary_location && w.primary_location.source && w.primary_location.source.display_name) || '';
    let link = '';
    if(w.doi) link = w.doi.startsWith('http') ? w.doi : 'https://doi.org/' + w.doi;
    else if(w.id) link = w.id;
    return {
      title: w.title,
      journal: [venue, w.publication_year].filter(Boolean).join(' · '),
      date: w.publication_year ? String(w.publication_year) : '',
      link, authors: authorsList, source:'openalex'
    };
  }catch(e){ return null; }
}

async function fetchOpenAlex(query){
  const url = `https://api.openalex.org/works?search=${encodeURIComponent(query)}&per-page=5&sort=publication_date:desc`;
  const res = await fetch(url);
  if(!res.ok) throw new Error('HTTP ' + res.status);
  const data = await res.json();
  const items = (data && data.results) ? data.results : [];
  return items.map(normalizeOpenAlexItem).filter(Boolean);
}

/* ---- Crossref: DOI-metadata registry covering ~150M works, keyless, CORS-friendly ---- */

function normalizeCrossrefItem(w){
  try{
    const title = (w.title && w.title[0]) || '';
    if(!title) return null;
    const journal = (w['container-title'] && w['container-title'][0]) || '';
    const dp = (w.published && w.published['date-parts'] && w.published['date-parts'][0])
      || (w['published-print'] && w['published-print']['date-parts'] && w['published-print']['date-parts'][0])
      || (w['published-online'] && w['published-online']['date-parts'] && w['published-online']['date-parts'][0])
      || [];
    const date = dp.length ? String(dp[0]) : '';
    const authorsList = (w.author||[]).slice(0,3).map(a=>[a.given,a.family].filter(Boolean).join(' ')).filter(Boolean).join(', ')
      + ((w.author||[]).length > 3 ? ' et al.' : '');
    return {
      title,
      journal: [journal, date].filter(Boolean).join(' · '),
      date,
      link: w.DOI ? 'https://doi.org/'+w.DOI : (w.URL || ''),
      authors: authorsList, source:'crossref'
    };
  }catch(e){ return null; }
}

async function fetchCrossref(query){
  const url = `https://api.crossref.org/works?query=${encodeURIComponent(query)}&rows=5&sort=published&order=desc`;
  const res = await fetch(url);
  if(!res.ok) throw new Error('HTTP ' + res.status);
  const data = await res.json();
  const items = (data && data.message && data.message.items) ? data.message.items : [];
  return items.map(normalizeCrossrefItem).filter(Boolean);
}

/* ---- CiNii Research: Japan's open academic-literature search (keyless, CORS-enabled) —
   used specifically to surface Japanese-language research for each key idea ---- */

function pickCiniiTitle(item){
  try{
    const dc = (item && (item['dc:title'] || item.title || item.name)) || null;
    if(!dc) return '';
    if(typeof dc === 'string') return dc;
    if(Array.isArray(dc)){
      const pref = dc.find(x=>x && x['@language']==='ja') || dc.find(x=>x && x['@language']==='en') || dc[0];
      if(pref) return (pref['@value'] || pref.value || (typeof pref==='string'?pref:'')) || '';
      return '';
    }
    if(dc['@value']) return dc['@value'];
    return '';
  }catch(e){ return ''; }
}

function normalizeCiniiItem(item){
  try{
    const title = pickCiniiTitle(item);
    if(!title) return null;
    let link = item['@id'] || item.url || item.link || '';
    if(typeof link === 'string' && link.endsWith('.json')) link = link.slice(0, -5);
    let date = item['dc:date'] || item['prism:publicationDate'] || item.datePublished || item.date || '';
    if(Array.isArray(date)) date = (date[0] && (date[0]['@value'] || date[0].value)) || '';
    if(date && typeof date === 'object') date = date['@value'] || '';
    return { title, journal:'', date: (date || '').toString(), link, source:'cinii' };
  }catch(e){ return null; }
}

async function fetchCinii(query){
  const url = `https://cir.nii.ac.jp/opensearch/articles?q=${encodeURIComponent(query)}&count=6&lang=ja&format=json`;
  const res = await fetch(url);
  if(!res.ok) throw new Error('HTTP ' + res.status);
  const data = await res.json();
  const items = (data && data.items) ? data.items : (data && data['@graph']) ? data['@graph'] : (Array.isArray(data) ? data : []);
  return items.map(normalizeCiniiItem).filter(Boolean);
}

async function withRetry(fn, retries, delayMs){
  try{
    return await fn();
  }catch(e){
    const msg = String((e && e.message) || '');
    if(retries > 0 && /429|rate|Too Many/i.test(msg)){
      await new Promise(r=>setTimeout(r, delayMs + Math.random()*400));
      return withRetry(fn, retries-1, Math.round(delayMs*1.7));
    }
    throw e;
  }
}

function effectiveQuery(wg){
  return [wg.queryTerms, ...(wg.extraKeywords||[])].filter(Boolean).join(' ') || wg.name;
}
function effectiveQueryJa(wg){
  return [wg.queryTermsJa, ...(wg.extraKeywordsJa||[])].filter(Boolean).join(' ') || wg.nameJa || wg.name;
}

async function loadLiteratureForIdea(idea, sourceKey, force){
  // sourceKey: 'intl' (Semantic Scholar + OpenAlex + Crossref, merged) or 'jp' (CiNii Research)
  const cacheKey = 'pluriverse:ideacache:v2:' + idea.id + ':' + sourceKey;
  if(!STATE.ideaCache[idea.id]) STATE.ideaCache[idea.id] = {};
  if(!force){
    const cached = await storeGet(cacheKey, null);
    if(cached && (Date.now() - cached.fetchedAt) < 1000*60*60*6){
      STATE.ideaCache[idea.id][sourceKey] = { loading:false, error:null, note:cached.note||null, items:cached.items, fetchedAt:cached.fetchedAt };
      render();
      return;
    }
  }
  STATE.ideaCache[idea.id][sourceKey] = { loading:true, error:null, note:null, items:(STATE.ideaCache[idea.id][sourceKey]||{}).items||[], fetchedAt:null };
  render();

  if(sourceKey === 'jp'){
    try{
      const items = await withRetry(()=>fetchCinii(effectiveQueryJa(idea)), 2, 1200);
      const payload = { loading:false, error:null, note:null, items, fetchedAt:Date.now() };
      STATE.ideaCache[idea.id][sourceKey] = payload;
      await storeSet(cacheKey, { items, note:null, fetchedAt:payload.fetchedAt });
    }catch(e){
      STATE.ideaCache[idea.id][sourceKey] = { loading:false, error:(e && e.message) || 'search blocked', note:null, items:(STATE.ideaCache[idea.id][sourceKey]||{}).items||[], fetchedAt:Date.now() };
    }
    render();
    return;
  }

  // international: query Semantic Scholar + OpenAlex + Crossref in parallel, merge & dedupe
  const q = effectiveQuery(idea);
  const sourceCalls = [
    { label:'Semantic Scholar', fn:()=>withRetry(()=>fetchSemanticScholar(q), 1, 1000) },
    { label:'OpenAlex', fn:()=>withRetry(()=>fetchOpenAlex(q), 1, 1000) },
    { label:'Crossref', fn:()=>withRetry(()=>fetchCrossref(q), 1, 1000) },
  ];
  const settled = await Promise.allSettled(sourceCalls.map(s=>s.fn()));
  let merged = [];
  const failed = [];
  settled.forEach((r, i)=>{
    if(r.status === 'fulfilled') merged = merged.concat(r.value);
    else failed.push(sourceCalls[i].label);
  });
  const seen = new Set();
  merged = merged.filter(p=>{
    const key = (p.title || '').toLowerCase().trim().replace(/\s+/g,' ');
    if(!key || seen.has(key)) return false;
    seen.add(key);
    return true;
  });
  merged.sort((a,b)=> (b.date||'').localeCompare(a.date||''));
  merged = merged.slice(0, 10);

  if(merged.length === 0 && failed.length === sourceCalls.length){
    STATE.ideaCache[idea.id][sourceKey] = { loading:false, error:'all sources unavailable', note:null, items:[], fetchedAt:Date.now() };
  } else {
    const note = failed.length ? t('lit_partial_note', failed.join(', ')) : null;
    const payload = { loading:false, error:null, note, items:merged, fetchedAt:Date.now() };
    STATE.ideaCache[idea.id][sourceKey] = payload;
    await storeSet(cacheKey, { items:merged, note, fetchedAt:payload.fetchedAt });
  }
  render();
}

function wrapText(text, maxChars){
  const words = text.split(' ');
  const lines = []; let cur='';
  words.forEach(w=>{
    if((cur+' '+w).trim().length > maxChars){ lines.push(cur.trim()); cur=w; }
    else cur = (cur+' '+w).trim();
  });
  if(cur) lines.push(cur);
  return lines;
}

// The 4 main hubs of the Theory of Change (top/right/bottom/left), matching the source diagram.
// WG5/WG6/WG4/WG1 ARE these hubs (their own name IS the hub name). WG2 and WG3 are satellites
// that feed into a hub (WG2 -> Gaps) or sit between two hubs (WG3 -> between Gaps and Diverse Local Practices).
const HUB_LAYOUT = [
  { wgId:'wg5', angle:-90 }, // International Trends - top
  { wgId:'wg6', angle:0   }, // Narratives and Values - right
  { wgId:'wg4', angle:90  }, // Diverse Local Practices - bottom
  { wgId:'wg1', angle:180 }, // Gaps in Existing Institutions - left
];

// Diagram-specific palette (kept local to the SVG rather than the app's CSS vars,
// to match the reference diagram's own color language).
const DIAG = {
  red:'#9C2B2B', gray:'#B7B7B7', blue:'#3E5C86', lavender:'#8F7FC7',
  tanFill:'#E9D6AC', tanBorder:'#B08D52',
  greenFill:'#B9E8C9', greenBorder:'#5B9B6F', greenText:'#2E5E3E',
  lavFill:'#D9D3F0', lavBorder:'#8F7FC7', lavText:'#4B3F7A',
};

// Each WG's tag box + which hub it connects to + where its text label sits.
const WG_BOX_LAYOUT = {
  wg5: { boxCx:1172, boxCy:205,  hub:'wg5', labelX:1172, labelY:130,  labelAnchor:'middle' },
  wg2: { boxCx:207,  boxCy:295,  hub:'wg1', labelX:207,  labelY:185,  labelAnchor:'middle' },
  wg6: { boxCx:1472, boxCy:595,  hub:'wg6', labelX:1560, labelY:555,  labelAnchor:'start'  },
  wg4: { boxCx:1291, boxCy:1128, hub:'wg4', labelX:1380, labelY:1055, labelAnchor:'start'  },
  wg3: { boxCx:507,  boxCy:1212, hub:'wg4', labelX:395,  labelY:1300, labelAnchor:'start'  },
  wg1: { boxCx:186,  boxCy:823,  hub:'wg1', labelX:140,  labelY:750,  labelAnchor:'start'  },
};

// The two collaborator call-outs, each drawn as its own ellipse with connector
// line(s) to the hub(s) it relates to.
const COLLABORATOR_ELLIPSES = [
  { themeId:'t-commoning',   hubIds:['wg1','wg4'], cx:321,  cy:1000, rx:105, ry:78, fill:DIAG.greenFill, border:DIAG.greenBorder, text:DIAG.greenText },
  { themeId:'t-relational',  hubIds:['wg6'],        cx:1447, cy:352,  rx:105, ry:82, fill:DIAG.lavFill,   border:DIAG.lavBorder,   text:DIAG.lavText },
];

function surname(fullName){
  const first = (fullName||'').split(' ')[0] || '';
  return first.charAt(0) + first.slice(1).toLowerCase();
}

function quadCurve(x1,y1,x2,y2,bow,color,width,markerId,dashed){
  const mx=(x1+x2)/2, my=(y1+y2)/2;
  const dx=x2-x1, dy=y2-y1, len=Math.hypot(dx,dy)||1;
  const nx=-dy/len, ny=dx/len;
  const ctrlX=mx+nx*bow, ctrlY=my+ny*bow;
  const marker = markerId ? `marker-end="url(#${markerId})"` : '';
  const dash = dashed ? 'stroke-dasharray="5 5"' : '';
  return `<path d="M${x1},${y1} Q${ctrlX},${ctrlY} ${x2},${y2}" fill="none" stroke="${color}" stroke-width="${width}" opacity="0.85" ${dash} ${marker} />`;
}

function ellipseEdgePoint(cx,cy,rx,ry,towardX,towardY){
  const angle = Math.atan2(towardY-cy, towardX-cx);
  return { x: cx+rx*Math.cos(angle), y: cy+ry*Math.sin(angle) };
}

function wgTextLabel(wg, x, y, anchor){
  const leads = authorsForWg(wg.id).filter(a=>a.role==='WG Lead').map(a=>a.name);
  const leadText = leads.length ? leads.join(', ') : (wg.defaultLead || '');
  const line1 = leadText ? `${wg.code}  [${leadText}]` : wg.code;
  const line1Wrapped = wrapText(line1, STATE.lang==='ja' ? 12 : 24);
  const line2Wrapped = wrapText(L(wg,'diagramNote'), STATE.lang==='ja' ? 12 : 26);
  let lines = [];
  line1Wrapped.forEach(l=>lines.push({text:l, cls:'lead'}));
  line2Wrapped.forEach(l=>lines.push({text:l, cls:'note'}));
  return lines.map((l,i)=>{
    const size = l.cls==='lead' ? 13 : 12;
    const weight = l.cls==='lead' ? 700 : 500;
    return `<text x="${x}" y="${y + i*16}" text-anchor="${anchor}" style="font-size:${size}px; font-weight:${weight}; fill:${DIAG.red};">${escapeHtml(l.text)}</text>`;
  }).join('');
}

function diagramSVG(){
  const cx=841, cy=678, coreRx=115, coreRy=130;
  const hubR=348, hubRx=95, hubRy=110;
  const wrapLimit = STATE.lang==='ja' ? 8 : 12;

  const hubPos = {
    wg5: { wg: byId(STATE.wgs,'wg5'), x:841, y:330 },
    wg6: { wg: byId(STATE.wgs,'wg6'), x:1108, y:678 },
    wg4: { wg: byId(STATE.wgs,'wg4'), x:841, y:1025 },
    wg1: { wg: byId(STATE.wgs,'wg1'), x:561, y:678 },
  };

  let meshSvg = '', arrowSvg = '', connectorSvg = '', collabSvg = '';

  // thin gray mesh between every pair of hubs (all 6 combinations)
  const hubIds = HUB_LAYOUT.map(h=>h.wgId);
  for(let i=0;i<hubIds.length;i++){
    for(let j=i+1;j<hubIds.length;j++){
      const a = hubPos[hubIds[i]], b = hubPos[hubIds[j]];
      if(!a||!b) continue;
      const eA = ellipseEdgePoint(a.x,a.y,hubRx,hubRy,cx,cy);
      const eB = ellipseEdgePoint(b.x,b.y,hubRx,hubRy,cx,cy);
      meshSvg += quadCurve(eA.x,eA.y,eB.x,eB.y, 30, DIAG.gray, 1.3, null, false);
    }
  }

  // thick red arrows, each hub straight into the center
  HUB_LAYOUT.forEach(h=>{
    const p = hubPos[h.wgId]; if(!p) return;
    const s = ellipseEdgePoint(p.x,p.y,hubRx,hubRy,cx,cy);
    const e = ellipseEdgePoint(cx,cy,coreRx,coreRy,p.x,p.y);
    arrowSvg += `<line x1="${s.x}" y1="${s.y}" x2="${e.x}" y2="${e.y}" stroke="${DIAG.red}" stroke-width="9" marker-end="url(#arrowRed)" />`;
  });

  // blue curved connectors: each WG box -> its hub
  let boxesSvg = '';
  Object.keys(WG_BOX_LAYOUT).forEach(wgId=>{
    const wg = byId(STATE.wgs, wgId); if(!wg) return;
    const cfg = WG_BOX_LAYOUT[wgId];
    const hub = hubPos[cfg.hub]; if(!hub) return;
    const boxW=160, boxH=80;
    const boxEdge = ellipseEdgePoint(cfg.boxCx, cfg.boxCy, boxW/2, boxH/2, hub.x, hub.y);
    const hubEdge = ellipseEdgePoint(hub.x, hub.y, hubRx, hubRy, cfg.boxCx, cfg.boxCy);
    connectorSvg += quadCurve(boxEdge.x, boxEdge.y, hubEdge.x, hubEdge.y, 40, DIAG.blue, 2.2, 'arrowBlue', false);

    const bubbleLines = wrapText(L(wg,'bubbleLabel'), STATE.lang==='ja' ? 7 : 13);
    boxesSvg += `
      <g class="petal" data-wg="${wg.id}">
        <rect x="${cfg.boxCx-boxW/2}" y="${cfg.boxCy-boxH/2}" width="${boxW}" height="${boxH}" rx="6"
              fill="${DIAG.tanFill}" stroke="${DIAG.tanBorder}" stroke-width="1.5" />
        ${bubbleLines.map((line,i)=>`<text x="${cfg.boxCx}" y="${cfg.boxCy + (i-(bubbleLines.length-1)/2)*14 + 4}" text-anchor="middle" style="font-size:12px; font-weight:600; fill:var(--ink);">${escapeHtml(line)}</text>`).join('')}
        ${wgTextLabel(wg, cfg.labelX, cfg.labelY, cfg.labelAnchor)}
      </g>`;
  });

  // lavender collaborator ellipses + their connector lines to hub(s)
  COLLABORATOR_ELLIPSES.forEach(cfg=>{
    const names = STATE.authors
      .filter(a=>a.role==='Collaborator' && a.themeIds && a.themeIds.includes(cfg.themeId))
      .map(a=>surname(a.name));
    const theme = byId(STATE.themes, cfg.themeId);
    if(!names.length) return;
    cfg.hubIds.forEach(hubId=>{
      const hub = hubPos[hubId]; if(!hub) return;
      const eA = ellipseEdgePoint(cfg.cx,cfg.cy,cfg.rx,cfg.ry,hub.x,hub.y);
      const eB = ellipseEdgePoint(hub.x,hub.y,hubRx,hubRy,cfg.cx,cfg.cy);
      collabSvg += quadCurve(eA.x,eA.y,eB.x,eB.y, 25, DIAG.lavender, 1.6, 'arrowLavender', false);
    });
    const titleLine = theme ? L(theme,'name')+':' : '';
    const nameLines = wrapText(names.join(', '), STATE.lang==='ja' ? 9 : 16);
    const allLines = [titleLine, ...nameLines];
    collabSvg += `
      <g class="petal" data-theme-tag="${cfg.themeId}">
        <ellipse cx="${cfg.cx}" cy="${cfg.cy}" rx="${cfg.rx}" ry="${cfg.ry}" fill="${cfg.fill}" stroke="${cfg.border}" stroke-width="1.5" />
        ${allLines.map((line,i)=>`<text x="${cfg.cx}" y="${cfg.cy + (i-(allLines.length-1)/2)*14 + 4}" text-anchor="middle" style="font-size:11px; font-weight:${i===0?700:500}; fill:${cfg.text};">${escapeHtml(line)}</text>`).join('')}
      </g>`;
  });

  // hub nodes (International Trends / Narratives and Values / Diverse Local Practices / Gaps in Existing Institutions)
  let hubsSvg = '';
  HUB_LAYOUT.forEach(h=>{
    const p = hubPos[h.wgId]; if(!p) return;
    const wg = p.wg;
    const labelLines = wrapText(L(wg,'name'), wrapLimit);
    hubsSvg += `
      <g class="petal" data-wg="${wg.id}" transform="translate(${p.x},${p.y})">
        <ellipse rx="${hubRx}" ry="${hubRy}" fill="#fff" stroke="var(--ink)" stroke-width="2" />
        ${labelLines.map((line,i)=>`<text x="0" y="${(i-(labelLines.length-1)/2)*16}" text-anchor="middle" style="font-size:14px; font-weight:600; fill:var(--ink);">${line}</text>`).join('')}
      </g>`;
  });

  const centerText = STATE.lang==='ja' ? '農地・森林の土地利用の変化' : 'Changes in Agricultural and Forest Land Use';
  const centerLines = wrapText(centerText, STATE.lang==='ja' ? 9 : 15);

  return `
  <svg viewBox="0 0 1700 1400" style="width:100%; height:auto;">
    <defs>
      <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="${DIAG.red}" />
      </marker>
      <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="${DIAG.blue}" />
      </marker>
      <marker id="arrowLavender" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="${DIAG.lavender}" />
      </marker>
    </defs>
    ${meshSvg}
    ${connectorSvg}
    ${collabSvg}
    ${arrowSvg}
    <ellipse cx="${cx}" cy="${cy}" rx="${coreRx}" ry="${coreRy}" fill="#fff" stroke="var(--ink)" stroke-width="2" />
    ${centerLines.map((line,i)=>`<text class="center-label" x="${cx}" y="${cy + (i-(centerLines.length-1)/2)*18 + 5}">${line}</text>`).join('')}
    ${hubsSvg}
    ${boxesSvg}
  </svg>`;
}

function renderAuthorCard(author){
  ensurePubsLoaded(author);
  const cache = STATE.pubCache[author.id] || {loading:true, items:[]};
  const manual = STATE.manualPubs.filter(p=>p.authorId===author.id);
  const allPubs = [...(cache.items||[]), ...manual].sort((a,b)=> (b.date||'').localeCompare(a.date||''));

  const links = [];
  if(author.researchmapSlug) links.push(`<a href="https://researchmap.jp/${author.researchmapSlug}" target="_blank" rel="noopener">researchmap ↗</a>`);
  if(author.kakenUrl) links.push(`<a href="${author.kakenUrl}" target="_blank" rel="noopener">KAKEN / nrid ↗</a>`);
  if(author.externalUrl) links.push(`<a href="${author.externalUrl}" target="_blank" rel="noopener">profile ↗</a>`);

  let pubBlock = '';
  if(cache.loading){
    pubBlock = `<div class="pub-empty"><span class="loader-dot"></span> ${t('pubs_loading')}</div>`;
  } else if(cache.noSource){
    pubBlock = `<div class="pub-empty">${t('pubs_no_source')}</div>`;
  } else if(allPubs.length===0 && !cache.error){
    pubBlock = `<div class="pub-empty">${t('pubs_none')}</div>`;
  } else {
    if(cache.error){
      pubBlock += `<div class="fetch-note">${t('pubs_error', cache.error)}</div>`;
    }
    pubBlock += `<div class="pub-list">` + allPubs.slice(0,8).map(p=>`
      <div class="pub">
        <div class="ptitle">${p.link ? `<a href="${p.link}" target="_blank" rel="noopener">${escapeHtml(p.title)}</a>` : escapeHtml(p.title)}</div>
        <div class="pmeta">${[p.journal, p.date].filter(Boolean).join(' · ')}${p.source==='manual' ? ' · '+t('added_manually') : ''}</div>
      </div>`).join('') + `</div>`;
  }

  return `
    <div class="author-card" data-author="${author.id}">
      <div class="top">
        <div>
          <div class="name">${author.name}</div>
          <div class="affil">${[author.role, author.affiliation].filter(Boolean).join(' · ')}</div>
          <div class="link-row">${links.join(' &nbsp;·&nbsp; ') || `<span class="fetch-note">${t('no_profile_links')}</span>`}</div>
        </div>
        <button class="refresh-btn ${cache.loading?'loading':''}" data-refresh="${author.id}">${cache.loading? t('refreshing') : t('refresh')}</button>
      </div>
      ${pubBlock}
    </div>`;
}

const SOURCE_LABELS = { semanticscholar:'Semantic Scholar', openalex:'OpenAlex', crossref:'Crossref', cinii:'CiNii' };

function litSourceBlock(wg, sourceKey, headingKey, searchHref, searchLabelKey){
  const cache = (STATE.ideaCache[wg.id] || {})[sourceKey];
  const items = cache && cache.items ? cache.items : [];
  const btnLabel = cache && cache.loading ? t('searching') : (cache ? t('search_again') : t('search_now'));
  return `
    <div class="lit-source-block" style="margin-bottom:14px;">
      <div class="lit-header">
        <p class="eyebrow" style="margin:0;">${t(headingKey)}</p>
        <button class="refresh-btn ${cache && cache.loading ? 'loading':''}" data-lit-refresh="${wg.id}" data-lit-source="${sourceKey}">${btnLabel}</button>
      </div>
      ${!cache ? `<div class="pub-empty">${t('lit_not_searched')}</div>` : ''}
      ${cache && cache.error ? `<div class="fetch-note">${t('lit_error', cache.error)}</div>` : ''}
      ${cache && cache.note ? `<div class="fetch-note">${cache.note}</div>` : ''}
      ${cache && !cache.loading && items.length===0 && !cache.error ? `<div class="pub-empty">${t('lit_none')}</div>` : ''}
      ${items.map(p=>`
        <div class="lit-item">
          <div>${p.link ? `<a href="${p.link}" target="_blank" rel="noopener">${escapeHtml(p.title)}</a>` : escapeHtml(p.title)}</div>
          <div class="lmeta">${[p.authors, p.journal || p.date, SOURCE_LABELS[p.source]].filter(Boolean).join(' · ')}</div>
        </div>`).join('')}
      <div class="fetch-note" style="margin-top:6px;"><a href="${searchHref}" target="_blank" rel="noopener">${t(searchLabelKey)}</a></div>
    </div>`;
}

function wgLitCardHtml(wg){
  const expanded = !!STATE.expandedIdeas[wg.id];
  const manual = STATE.manualSources.filter(s=>s.wgId===wg.id);
  let litHtml = '';
  if(expanded){
    const concepts = L(wg, 'focusConcepts') || [];
    const conceptChips = concepts.length ? `
      <div style="margin:8px 0 14px;">
        <span class="eyebrow" style="margin-right:6px;">${t('ideas_focus_label')}</span>
        ${concepts.map(c=>`<span class="chip"><span class="sw" style="background:${wg.color}"></span>${c}</span>`).join(' ')}
      </div>` : '';
    const kwBlock = `
      <div class="kw-block">
        <p class="eyebrow" style="margin:0 0 6px;">${t('ideas_kw_intl_label')}</p>
        <div class="kw-chips">
          ${(wg.extraKeywords||[]).map(k=>`<span class="chip">${escapeHtml(k)}<button class="chip-x" data-remove-kw="${wg.id}" data-kw-lang="en" data-kw-value="${escapeHtml(k)}">×</button></span>`).join('')}
          ${(!wg.extraKeywords||!wg.extraKeywords.length) ? `<span class="fetch-note">${t('ideas_kw_none')}</span>` : ''}
        </div>
        <div class="add-source-row">
          <input type="text" placeholder="${t('ideas_add_kw_intl_ph')}" data-kw-input-en="${wg.id}" />
          <button class="btn ghost small" data-add-kw="${wg.id}" data-kw-lang="en">${t('ideas_add_kw_btn')}</button>
        </div>
        <p class="eyebrow" style="margin:12px 0 6px;">${t('ideas_kw_jp_label')}</p>
        <div class="kw-chips">
          ${(wg.extraKeywordsJa||[]).map(k=>`<span class="chip">${escapeHtml(k)}<button class="chip-x" data-remove-kw="${wg.id}" data-kw-lang="ja" data-kw-value="${escapeHtml(k)}">×</button></span>`).join('')}
          ${(!wg.extraKeywordsJa||!wg.extraKeywordsJa.length) ? `<span class="fetch-note">${t('ideas_kw_none')}</span>` : ''}
        </div>
        <div class="add-source-row">
          <input type="text" placeholder="${t('ideas_add_kw_jp_ph')}" data-kw-input-ja="${wg.id}" />
          <button class="btn ghost small" data-add-kw="${wg.id}" data-kw-lang="ja">${t('ideas_add_kw_btn')}</button>
        </div>
        <div class="fetch-note" style="margin-top:6px;">${t('ideas_kw_note')}</div>
      </div>`;
    const intlBlock = litSourceBlock(wg, 'intl', 'lit_intl_heading',
      `https://scholar.google.com/scholar?q=${encodeURIComponent(effectiveQuery(wg))}`, 'search_on_scholar');
    const jpBlock = litSourceBlock(wg, 'jp', 'lit_jp_heading',
      `https://cir.nii.ac.jp/all?q=${encodeURIComponent(effectiveQueryJa(wg))}`, 'search_on_cinii');
    litHtml = `
      ${conceptChips}
      ${kwBlock}
      <div class="lit-section">
        ${intlBlock}
        ${jpBlock}
        <div style="border-top:1px dashed var(--line); padding-top:10px; margin-top:4px;">
          <p class="eyebrow" style="margin:0 0 8px;">${t('lit_manual_heading')}</p>
          ${manual.length===0 ? `<div class="pub-empty">${t('lit_none')}</div>` : manual.map(p=>`
            <div class="lit-item">
              <div>${p.link ? `<a href="${p.link}" target="_blank" rel="noopener">${escapeHtml(p.title)}</a>` : escapeHtml(p.title)}</div>
              <div class="lmeta">${t('added_manually')}</div>
            </div>`).join('')}
          <div class="add-source-row">
            <input type="text" placeholder="${t('add_source_title_ph')}" data-src-title="${wg.id}" />
            <input type="text" placeholder="${t('add_source_link_ph')}" data-src-link="${wg.id}" style="max-width:220px;" />
            <button class="btn ghost small" data-add-source="${wg.id}">${t('add_source_btn')}</button>
          </div>
        </div>
        <div class="fetch-note" style="margin-top:10px;">${t('api_note')}</div>
      </div>`;
  }
  return `
    <div class="idea-card" data-idea="${wg.id}">
      <div class="idea-head" data-idea-toggle="${wg.id}">
        <div style="display:flex; align-items:center; gap:10px;">
          <span class="wg-dot" style="background:${wg.color}"></span>
          <div>
            <h4>${wg.code} · ${L(wg,'name')}</h4>
            <div class="fetch-note" style="margin-top:2px;">${L(wg,'subtitle')}</div>
          </div>
        </div>
        <span class="idea-toggle">${expanded ? '−' : '+'}</span>
      </div>
      ${expanded ? `
      <div class="idea-body">
        <p class="fetch-note" style="font-size:12.5px; margin-bottom:2px;">${L(wg,'description')}</p>
        ${litHtml}
      </div>` : ''}
    </div>`;
}

async function invalidateLitCache(wgId){
  delete STATE.ideaCache[wgId];
  try{ await storeDelete('pluriverse:ideacache:v2:'+wgId+':intl', true); }catch(e){}
  try{ await storeDelete('pluriverse:ideacache:v2:'+wgId+':jp', true); }catch(e){}
}

function renderKeyIdeas(){
  document.getElementById('app').innerHTML = `
    <p class="eyebrow">${t('ideas_eyebrow')}</p>
    <h2 class="section-title">${t('ideas_heading')}</h2>
    <p class="lede">${t('ideas_lede')}</p>
    <p class="fetch-note" style="max-width:640px; margin-bottom:18px;">${t('ideas_journal_note')}</p>
    <div class="idea-category">
      ${STATE.wgs.map(wgLitCardHtml).join('')}
    </div>
  `;
  document.querySelectorAll('[data-idea-toggle]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const id = el.dataset.ideaToggle;
      STATE.expandedIdeas[id] = !STATE.expandedIdeas[id];
      render();
    });
  });
  document.querySelectorAll('[data-lit-refresh]').forEach(b=>{
    b.addEventListener('click', (e)=>{
      e.stopPropagation();
      const wg = byId(STATE.wgs, b.dataset.litRefresh);
      const sourceKey = b.dataset.litSource;
      const alreadyHasCache = !!((STATE.ideaCache[wg.id]||{})[sourceKey]);
      loadLiteratureForIdea(wg, sourceKey, alreadyHasCache); // first click: use shared cache if fresh; re-clicks force a refetch
    });
  });
  document.querySelectorAll('[data-add-source]').forEach(b=>{
    b.addEventListener('click', async (e)=>{
      e.stopPropagation();
      const wgId = b.dataset.addSource;
      const titleInput = document.querySelector(`[data-src-title="${wgId}"]`);
      const linkInput = document.querySelector(`[data-src-link="${wgId}"]`);
      const title = titleInput.value.trim();
      if(!title){ showToast(t('add_title_first')); return; }
      STATE.manualSources.push({ id:'s-'+Math.random().toString(36).slice(2,8), wgId, title, link:linkInput.value.trim(), source:'manual' });
      await storeSet('pluriverse:manualSourcesByWg', STATE.manualSources);
      render(); showToast(t('source_added'));
    });
  });
  document.querySelectorAll('[data-add-kw]').forEach(b=>{
    b.addEventListener('click', async (e)=>{
      e.stopPropagation();
      const wgId = b.dataset.addKw;
      const lang = b.dataset.kwLang; // 'en' or 'ja'
      const input = document.querySelector(`[data-kw-input-${lang}="${wgId}"]`);
      const val = input.value.trim();
      if(!val){ showToast(t('ideas_kw_empty_warn')); return; }
      const wg = byId(STATE.wgs, wgId);
      const field = lang === 'ja' ? 'extraKeywordsJa' : 'extraKeywords';
      if(!wg[field]) wg[field] = [];
      if(!wg[field].includes(val)) wg[field].push(val);
      await storeSet('pluriverse:wgs', STATE.wgs);
      await invalidateLitCache(wgId);
      render(); showToast(t('ideas_kw_added'));
    });
  });
  document.querySelectorAll('[data-remove-kw]').forEach(b=>{
    b.addEventListener('click', async (e)=>{
      e.stopPropagation();
      const wgId = b.dataset.removeKw;
      const lang = b.dataset.kwLang;
      const val = b.dataset.kwValue;
      const wg = byId(STATE.wgs, wgId);
      const field = lang === 'ja' ? 'extraKeywordsJa' : 'extraKeywords';
      wg[field] = (wg[field]||[]).filter(x=>x!==val);
      await storeSet('pluriverse:wgs', STATE.wgs);
      await invalidateLitCache(wgId);
      render(); showToast(t('ideas_kw_removed'));
    });
  });
}

function personLinksAndPubsHtml(author){
  ensurePubsLoaded(author);
  const cache = STATE.pubCache[author.id] || {loading:true, items:[]};
  const manual = STATE.manualPubs.filter(p=>p.authorId===author.id);
  const allPubs = [...(cache.items||[]), ...manual].sort((a,b)=> (b.date||'').localeCompare(a.date||''));

  const links = [];
  if(author.researchmapSlug) links.push(`<a href="https://researchmap.jp/${author.researchmapSlug}" target="_blank" rel="noopener">researchmap ↗</a>`);
  if(author.kakenUrl) links.push(`<a href="${author.kakenUrl}" target="_blank" rel="noopener">KAKEN / nrid ↗</a>`);
  if(author.externalUrl) links.push(`<a href="${author.externalUrl}" target="_blank" rel="noopener">profile ↗</a>`);
  if(author.researchgateUrl) links.push(`<a href="${author.researchgateUrl}" target="_blank" rel="noopener">ResearchGate ↗</a>`);
  if(author.contact) links.push(escapeHtml(author.contact));

  let pubBlock = '';
  if(cache.loading){
    pubBlock = `<div class="pub-empty"><span class="loader-dot"></span> ${t('pubs_loading')}</div>`;
  } else if(cache.noSource){
    pubBlock = `<div class="pub-empty">${t('pubs_no_source')}</div>`;
  } else if(allPubs.length===0 && !cache.error){
    pubBlock = `<div class="pub-empty">${t('pubs_none')}</div>`;
  } else {
    if(cache.error){
      pubBlock += `<div class="fetch-note">${t('pubs_error', cache.error)}</div>`;
    }
    pubBlock += `<div class="pub-list">` + allPubs.slice(0,8).map(p=>`
      <div class="pub">
        <div class="ptitle">${p.link ? `<a href="${p.link}" target="_blank" rel="noopener">${escapeHtml(p.title)}</a>` : escapeHtml(p.title)}</div>
        <div class="pmeta">${[p.journal, p.date].filter(Boolean).join(' · ')}${p.source==='manual' ? ' · '+t('added_manually') : ''}</div>
      </div>`).join('') + `</div>`;
  }

  return `
    <div class="top" style="margin-top:2px;">
      <div class="link-row">${links.join(' &nbsp;·&nbsp; ') || `<span class="fetch-note">${t('no_profile_links')}</span>`}</div>
      <button class="refresh-btn ${cache.loading?'loading':''}" data-refresh="${author.id}">${cache.loading? t('refreshing') : t('refresh')}</button>
    </div>
    ${pubBlock}`;
}

function initials(name){
  return name.split(' ').filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase();
}

function renderTeam(){
  const cards = STATE.authors.map((a, i)=>{
    const wgs = (a.wgIds||[]).map(id=>byId(STATE.wgs,id)).filter(Boolean);
    const themes = (a.themeIds||[]).map(id=>byId(STATE.themes,id)).filter(Boolean);
    const avatarColor = wgs[0] ? wgs[0].color : 'var(--ink-faint)';
    const expanded = !!STATE.expandedAuthors[a.id];
    const avatar = a.photoUrl
      ? `<img src="${a.photoUrl}" alt="${escapeHtml(a.name)}" style="width:40px; height:40px; border-radius:50%; object-fit:cover; flex:none;" />`
      : `<div class="avatar" style="background:${avatarColor}">${initials(a.name)}</div>`;
    const isFirst = i === 0, isLast = i === STATE.authors.length - 1;
    return `
      <div class="team-card" data-team="${a.id}">
        <div class="top">
          ${avatar}
          <div style="flex:1;">
            <div class="name">${escapeHtml(a.name)}</div>
            <div class="role-line">${escapeHtml([a.role, a.affiliation].filter(Boolean).join(' · '))}</div>
          </div>
          <div class="reorder-btns">
            <button class="icon-btn" data-move-up="${a.id}" ${isFirst?'disabled':''} title="${t('team_move_up')}">▲</button>
            <button class="icon-btn" data-move-down="${a.id}" ${isLast?'disabled':''} title="${t('team_move_down')}">▼</button>
          </div>
        </div>
        <div class="chips">
          ${wgs.map(wg=>`<span class="chip"><span class="sw" style="background:${wg.color}"></span>${wg.code}</span>`).join(' ')}
          ${themes.map(th=>`<span class="chip"><span class="sw" style="background:${th.color}"></span>${L(th,'name')}</span>`).join(' ')}
          ${a.researchmapSlug ? `<span class="tag-mini" style="border-color:var(--moss); color:var(--moss-deep);">${t('autopull_on')}</span>` : ''}
        </div>
        <textarea class="status-box" placeholder="${t('status_placeholder')}" data-status="${a.id}">${a.status||''}</textarea>
        <div style="display:flex; gap:14px; margin-top:10px;">
          <button class="icon-btn" data-toggle-person="${a.id}">${expanded ? t('team_hide_details') : t('team_show_details')}</button>
          <button class="icon-btn" data-edit-author="${a.id}">${t('edit')}</button>
        </div>
        ${expanded ? `<div style="margin-top:10px; border-top:1px solid var(--line); padding-top:10px;">
          ${a.bio ? `<p class="fetch-note" style="margin-bottom:8px;">${escapeHtml(a.bio)}</p>` : ''}
          ${personLinksAndPubsHtml(a)}
        </div>` : ''}
      </div>`;
  }).join('');

  document.getElementById('app').innerHTML = `
    <p class="eyebrow">${t('team_eyebrow')}</p>
    <h2 class="section-title">${t('team_heading')}</h2>
    <p class="lede">${t('team_lede')}</p>
    <div style="margin:16px 0;"><button class="btn" id="add-author-btn">${t('add_person')}</button></div>
    ${STATE.showAuthorForm ? authorFormHtml(STATE.editingAuthorId ? byId(STATE.authors, STATE.editingAuthorId) : null) : ''}
    <div class="team-grid">${cards}</div>
  `;

  document.querySelectorAll('[data-move-up]').forEach(b=>{
    b.addEventListener('click', async ()=>{
      const idx = STATE.authors.findIndex(a=>a.id===b.dataset.moveUp);
      if(idx <= 0) return;
      [STATE.authors[idx-1], STATE.authors[idx]] = [STATE.authors[idx], STATE.authors[idx-1]];
      await storeSet('pluriverse:authors', STATE.authors);
      render();
    });
  });
  document.querySelectorAll('[data-move-down]').forEach(b=>{
    b.addEventListener('click', async ()=>{
      const idx = STATE.authors.findIndex(a=>a.id===b.dataset.moveDown);
      if(idx === -1 || idx >= STATE.authors.length-1) return;
      [STATE.authors[idx+1], STATE.authors[idx]] = [STATE.authors[idx], STATE.authors[idx+1]];
      await storeSet('pluriverse:authors', STATE.authors);
      render();
    });
  });

  document.getElementById('add-author-btn').addEventListener('click', ()=>{
    STATE.showAuthorForm=true; STATE.editingAuthorId=null; render();
  });

  document.querySelectorAll('[data-status]').forEach(ta=>{
    ta.addEventListener('blur', async ()=>{
      const author = byId(STATE.authors, ta.dataset.status);
      if(author.status !== ta.value){
        author.status = ta.value;
        await storeSet('pluriverse:authors', STATE.authors);
        showToast(t('status_updated'));
      }
    });
  });

  document.querySelectorAll('[data-toggle-person]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const id = b.dataset.togglePerson;
      STATE.expandedAuthors[id] = !STATE.expandedAuthors[id];
      render();
    });
  });

  document.querySelectorAll('[data-edit-author]').forEach(b=>{
    b.addEventListener('click', ()=>{
      STATE.showAuthorForm=true; STATE.editingAuthorId=b.dataset.editAuthor; render();
    });
  });

  document.querySelectorAll('[data-refresh]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const author = byId(STATE.authors, b.dataset.refresh);
      loadPubsForAuthor(author, true);
    });
  });

  const cancelBtn = document.getElementById('f-cancel');
  if(cancelBtn) cancelBtn.addEventListener('click', ()=>{ STATE.showAuthorForm=false; STATE.editingAuthorId=null; render(); });

  const saveBtn = document.getElementById('f-save');
  if(saveBtn) saveBtn.addEventListener('click', async ()=>{
    const wgIds = Array.from(document.querySelectorAll('.f-wg:checked')).map(c=>c.value);
    const themeIds = Array.from(document.querySelectorAll('.f-theme:checked')).map(c=>c.value);
    const payload = {
      name: document.getElementById('f-name').value.trim(),
      role: document.getElementById('f-role').value,
      affiliation: document.getElementById('f-affil').value.trim(),
      researchmapSlug: document.getElementById('f-rmap').value.trim(),
      kakenUrl: document.getElementById('f-kaken').value.trim(),
      externalUrl: document.getElementById('f-ext').value.trim(),
      notes: document.getElementById('f-notes').value.trim(),
      bio: document.getElementById('f-bio').value.trim(),
      contact: document.getElementById('f-contact').value.trim(),
      photoUrl: document.getElementById('f-photo').value.trim(),
      researchgateUrl: document.getElementById('f-researchgate').value.trim(),
      wgIds, themeIds,
    };
    if(!payload.name){ showToast(t('name_required')); return; }
    if(STATE.editingAuthorId){
      const existing = byId(STATE.authors, STATE.editingAuthorId);
      Object.assign(existing, payload);
      delete STATE.pubCache[existing.id];
    } else {
      payload.id = 'a-' + payload.name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'') + '-' + Math.random().toString(36).slice(2,6);
      payload.status = '';
      STATE.authors.push(payload);
    }
    await storeSet('pluriverse:authors', STATE.authors);
    STATE.showAuthorForm=false; STATE.editingAuthorId=null;
    render(); showToast(t('saved'));
  });

  const deleteBtn = document.getElementById('f-delete');
  if(deleteBtn) deleteBtn.addEventListener('click', async ()=>{
    STATE.authors = STATE.authors.filter(a=>a.id!==STATE.editingAuthorId);
    await storeSet('pluriverse:authors', STATE.authors);
    STATE.showAuthorForm=false; STATE.editingAuthorId=null;
    render(); showToast(t('removed'));
  });
}

    if(v.name==='pub-home') renderPublicHome();
    else if(v.name==='pub-team') renderPublicTeam();
    else if(v.name==='pub-blog') renderPublicBlog();
    else if(v.name==='pub-contact') renderPublicContact();
    else if(v.name==='pub-post') renderPublicPost(v.param);
    else if(v.name==='login') renderLoginView();
    else renderPublicHome();
    return;
  }
  if(v.name==='overview') renderOverview();
  else if(v.name==='wg') renderWgDetail(v.param);
  else if(v.name==='ideas') renderKeyIdeas();
  else if(v.name==='cases') renderCases();
  else if(v.name==='feed') renderFeed();
  else if(v.name==='team') renderTeam();
  else if(v.name==='themes') renderThemes();
  else if(v.name==='theme') renderThemeDetail(v.param);
  else if(v.name==='blog') renderBlogAdmin();
  else if(v.name==='settings') renderSettings();
  else renderOverview();
}

    <h3 style="${h3}">Project Overview</h3>

async function uploadBlogPdf(postId, file){
  if(!fsStorage) throw new Error('Firebase Storage not available');
  const ref = fsStorage.ref().child(`blog-pdfs/${postId}/${Date.now()}-${file.name}`);
  const snapshot = await ref.put(file);
  const url = await snapshot.ref.getDownloadURL();
  return { url, name: file.name };
}

function renderBlogAdmin(){
  const posts = [...STATE.blogPosts].sort((a,b)=>(b.updatedAt||b.createdAt||0)-(a.updatedAt||a.createdAt||0));
  document.getElementById('app').innerHTML = `
    <p class="eyebrow">${t('blog_admin_eyebrow')}</p>
    <h2 class="section-title">${t('blog_admin_heading')}</h2>
    <p class="lede">${t('blog_admin_lede')}</p>
    <div style="margin:16px 0;"><button class="btn" id="blog-add-btn">${t('blog_add_btn')}</button></div>
    ${STATE.showBlogForm ? blogFormHtml(STATE.editingBlogId ? STATE.blogPosts.find(p=>p.id===STATE.editingBlogId) : null) : ''}
    ${posts.length===0 ? `<div class="empty-state">${t('blog_admin_empty')}</div>` : posts.map(p=>`
      <div class="feed-item">
        <div class="ftitle">${escapeHtml(p.title)} ${p.published ? `<span class="tag-mini" style="border-color:var(--moss); color:var(--moss-deep);">${t('blog_published')}</span>` : `<span class="tag-mini">${t('blog_draft')}</span>`} ${p.pdfUrl ? `<span class="tag-mini">📄 PDF</span>` : ''}</div>
        <div class="fnote">${escapeHtml((p.body||'').slice(0,160))}${(p.body||'').length>160?'…':''}</div>
        <div class="fmeta">
          <span class="fby">${escapeHtml(p.author||'')} · ${fmtDate(p.updatedAt||p.createdAt)}</span>
          <div class="feed-tags">
            <button class="icon-btn" data-edit-blog="${p.id}">${t('edit')}</button>
            <button class="icon-btn" data-toggle-publish="${p.id}">${p.published ? t('blog_unpublish') : t('blog_publish')}</button>
          </div>
        </div>
      </div>`).join('')}
  `;

  document.getElementById('blog-add-btn').addEventListener('click', ()=>{ STATE.showBlogForm=true; STATE.editingBlogId=null; render(); });
  const cancelBtn = document.getElementById('blog-cancel');
  if(cancelBtn) cancelBtn.addEventListener('click', ()=>{ STATE.showBlogForm=false; STATE.editingBlogId=null; render(); });

  const saveBtn = document.getElementById('blog-save');
  if(saveBtn) saveBtn.addEventListener('click', async ()=>{
    const title = document.getElementById('blog-title').value.trim();
    if(!title){ showToast(t('blog_title_required')); return; }
    const body = document.getElementById('blog-body').value.trim();
    const author = document.getElementById('blog-author').value.trim();

    let postId = STATE.editingBlogId || ('b-'+Math.random().toString(36).slice(2,9));
    let pdfFields = {};
    const fileInput = document.getElementById('blog-pdf-input');
    const file = fileInput && fileInput.files && fileInput.files[0];
    if(file){
      if(!fsStorage){
        showToast(t('blog_pdf_unavailable'));
        return;
      }
      saveBtn.disabled = true;
      saveBtn.textContent = t('blog_pdf_uploading');
      try{
        const { url, name } = await uploadBlogPdf(postId, file);
        pdfFields = { pdfUrl: url, pdfName: name };
      }catch(e){
        console.error('PDF upload failed', e);
        showToast(t('blog_pdf_upload_failed'));
        saveBtn.disabled = false;
        return;
      }
    }

    if(STATE.editingBlogId){
      const post = STATE.blogPosts.find(p=>p.id===STATE.editingBlogId);
      Object.assign(post, {title, body, author, updatedAt:Date.now(), ...pdfFields});
    } else {
      STATE.blogPosts.push({ id:postId, title, body, author, published:false, createdAt:Date.now(), updatedAt:Date.now(), publishedAt:null, pdfUrl:'', pdfName:'', ...pdfFields });
    }
    await storeSet('pluriverse:blog', STATE.blogPosts);
    STATE.showBlogForm=false; STATE.editingBlogId=null;
    render(); showToast(t('saved'));
  });

  document.querySelectorAll('[data-edit-blog]').forEach(b=>{
    b.addEventListener('click', ()=>{ STATE.showBlogForm=true; STATE.editingBlogId=b.dataset.editBlog; render(); });
  });

  document.querySelectorAll('[data-toggle-publish]').forEach(b=>{
    b.addEventListener('click', async ()=>{
      const post = STATE.blogPosts.find(p=>p.id===b.dataset.togglePublish);
      post.published = !post.published;
      post.publishedAt = post.published ? Date.now() : post.publishedAt;
      await storeSet('pluriverse:blog', STATE.blogPosts);
      render(); showToast(post.published ? t('blog_now_published') : t('blog_now_unpublished'));
    });
  });

  const deleteBtn = document.getElementById('blog-delete');
  if(deleteBtn) deleteBtn.addEventListener('click', async ()=>{
    const post = STATE.blogPosts.find(p=>p.id===STATE.editingBlogId);
    if(post && post.pdfUrl && fsStorage){
      try{ await fsStorage.refFromURL(post.pdfUrl).delete(); }catch(e){ /* best-effort cleanup */ }
    }
    STATE.blogPosts = STATE.blogPosts.filter(p=>p.id!==STATE.editingBlogId);
    await storeSet('pluriverse:blog', STATE.blogPosts);
    STATE.showBlogForm=false; STATE.editingBlogId=null;
    render(); showToast(t('removed'));
  });
}

/* ============================= PASSWORD GATE ============================= */
// Soft deterrent only — see the SITE_PASSWORD comment above for why.

function passwordGateHtml(wrong){
  return `
    <div style="max-width:360px; margin:60px auto 0; text-align:center;">
      <p class="eyebrow">${t('pw_gate_eyebrow')}</p>
      <h2 class="section-title">${t('pw_gate_heading')}</h2>
      <p class="lede" style="margin:8px auto 20px;">${t('pw_gate_lede')}</p>
      <input type="password" id="site-password-input" placeholder="${t('pw_gate_placeholder')}"
             style="width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:6px; margin-bottom:10px; text-align:center; box-sizing:border-box;" />
      ${wrong ? `<div class="fetch-note" style="color:var(--clay); margin-bottom:10px;">${t('pw_gate_wrong')}</div>` : ''}
      <button class="btn" id="site-password-submit" style="width:100%; justify-content:center;">${t('pw_gate_submit')}</button>
    </div>`;
}

function wirePasswordGate(){
  document.getElementById('site-password-submit').addEventListener('click', checkPassword);
  document.getElementById('site-password-input').addEventListener('keydown', (e)=>{
    if(e.key==='Enter') checkPassword();
  });
  document.getElementById('site-password-input').focus();
}

async function checkPassword(){
  const val = document.getElementById('site-password-input').value;
  if(val === SITE_PASSWORD){
    await storeSet('pluriverse:passwordOk', true, false); // private, per-browser
    siteLocked = false;
    STATE.view = {name:'overview', param:null};
    render();
  } else {
    document.getElementById('app').innerHTML = passwordGateHtml(true);
    wirePasswordGate();
  }
}

(async function init(){
  document.getElementById('app').innerHTML = `<div class="empty-state">Loading… / 読み込み中…</div>`;
  await initStorageBackend();
  STATE.lang = await storeGet('pluriverse:lang', 'en', false);
  const alreadyUnlocked = await storeGet('pluriverse:passwordOk', false, false);
  siteLocked = !alreadyUnlocked;
  await loadAll();
  STATE.view = siteLocked ? {name:'pub-home', param:null} : {name:'overview', param:null};
  render();
  if (!usingClaudeStorage && !firebaseReady) {
    showToast('No storage backend configured — nothing will be saved. See FIREBASE_CONFIG in index.html.');
  }
})();
</script>

if ('serviceWorker' in navigator) {

    navigator.serviceWorker.register('sw.js').catch((err) => {
      console.warn('Service worker registration failed:', err);
    });
  });
}
</script>
